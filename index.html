<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Nilai Siswa - Smart Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .input-focus:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        .scroll-custom::-webkit-scrollbar { width: 6px; height: 6px; }
        .scroll-custom::-webkit-scrollbar-track { background: #f1f1f1; }
        .scroll-custom::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .scroll-custom::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-slate-800 tracking-tight">E-Monitoring Nilai Siswa</h1>
            <p class="text-slate-500 mt-2 text-lg">Input data hafalan dan ibadah praktis secara cepat</p>
        </header>

        <div class="glass-morphism p-6 rounded-3xl shadow-xl mb-8 max-w-xl mx-auto transition-all duration-500 hover:shadow-2xl">
            <label class="block text-sm font-semibold text-slate-700 mb-2">Pilih Wali Kelas:</label>
            <select id="waliKelasSelect" onchange="handleTeacherChange(this.value)" class="w-full p-4 rounded-2xl bg-slate-50 border-2 border-slate-100 text-slate-800 font-medium input-focus transition-all appearance-none cursor-pointer">
                <option value="">-- Silakan Pilih Wali Kelas --</option>
                <option value="3A|Dini Nadzifah, M.Ag">3A - Dini Nadzifah, M.Ag</option>
                <option value="3B|Wulan Sri Ratna">3B - Wulan Sri Ratna</option>
                <option value="3C|Adela Nur Kholishoh">3C - Adela Nur Kholishoh</option>
                <option value="3D|Annisa fatihah">3D - Annisa fatihah</option>
                <option value="3E|Yeni Siti Sarifah, S.Pd.I">3E - Yeni Siti Sarifah, S.Pd.I</option>
                <option value="3F|Dedi Munajat, M.Sos">3F - Dedi Munajat, M.Sos</option>
                <option value="3G|Muhammad Wahid, S.Kom.I">3G - Muhammad Wahid, S.Kom.I</option>
                <option value="3H|Awaluddin Fauzan, S.Ag">3H - Awaluddin Fauzan, S.Ag</option>
                <option value="3I|Ahmad Yusup, S.Pd">3I - Ahmad Yusup, S.Pd</option>
                <option value="3J|M. Saddam Ramadhan, S.Pd.">3J - M. Saddam Ramadhan, S.Pd.</option>
            </select>
        </div>

        <div id="studentContainer" class="hidden animate-in fade-in duration-700">
            <div class="glass-morphism rounded-3xl shadow-2xl overflow-hidden mb-8">
                <div class="bg-indigo-600 p-6 flex flex-col md:flex-row justify-between items-center text-white">
                    <div>
                        <h2 id="displayKelas" class="text-2xl font-bold">Daftar Siswa Kelas</h2>
                        <p id="displayWali" class="opacity-80"></p>
                    </div>
                    <div class="mt-4 md:mt-0">
                        <span class="bg-white/20 px-4 py-2 rounded-full text-sm font-medium backdrop-blur-md">
                            Status: Siap Input Data
                        </span>
                    </div>
                </div>

                <div class="overflow-x-auto scroll-custom">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-600 text-xs font-bold uppercase tracking-wider">
                                <th class="p-4 border-b">No</th>
                                <th class="p-4 border-b min-w-[200px]">Nama Siswa</th>
                                <th class="p-4 border-b text-center">Tafsir</th>
                                <th class="p-4 border-b text-center">Hadits</th>
                                <th class="p-4 border-b text-center">Mahf. 3</th>
                                <th class="p-4 border-b text-center">Mahf. 1</th>
                                <th class="p-4 border-b text-center">Doa</th>
                                <th class="p-4 border-b text-center">Al-Quran</th>
                                <th class="p-4 border-b text-center">Wudlu</th>
                                <th class="p-4 border-b text-center">Tayammum</th>
                                <th class="p-4 border-b text-center">Sholat</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody" class="divide-y divide-slate-100">
                            <!-- Rows injected by JavaScript -->
                        </tbody>
                    </table>
                </div>

                <div class="p-8 bg-slate-50 flex flex-col md:flex-row items-center justify-between gap-4">
                    <p class="text-slate-500 text-sm italic">*Data akan dikirim secara kolektif. Siswa yang nilainya kosong tidak akan masuk ke sistem.</p>
                    <button id="btnKirim" onclick="submitData()" class="group relative bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-12 rounded-2xl shadow-lg shadow-indigo-200 transition-all duration-300 transform hover:-translate-y-1 active:scale-95 flex items-center gap-2">
                        <span>Kirim Data ke Spreadsheet</span>
                        <svg id="loadingSpinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="statusBox" class="hidden fixed top-10 right-1/2 translate-x-1/2 md:right-10 md:translate-x-0 z-50 p-6 rounded-2xl shadow-2xl animate-bounce">
            <!-- Content dynamic -->
        </div>
    </div>

            "3D": ["Aira Zahra Firdaus", "Al Egisa Nur Desi Yanti", "Amira Nurul Izzati Wahid", "Aretta Putri Saka Giri Kawiswari", "Diva Silvia", "Filzah Hilwa Azizah", "Hafshah Khairun Nisa", "Meisya Sarah Nurfadillah", "Mikhayla Nikeisya Angelique Rahman", "Missel Fairuz Queena", "Nadya Mustika Putri", "Nasya Shakila Kirania", "Qonita Mei Zerlina", "Ratu Kynan Avrisha", "RD. Alexandria Kanaya Islamey", "Saqila Irdina", "Sayyidah Humaira Hikmatul Kamaliyah", "Syahla Atha Juni Zhahirah", "Siti Qodariyah", "Syarifatul Aghniya", "Tania Rachmalina Mardani", "Vina Ramadhani", "Windi Diyanti Awaludin", "Yetce Sherryna Abriyati Nenre", "Zahirah Addzikra Putrisyah"],

            "3G": ["Andara Putra", "Argya Putra Risnandar", "Bani Lukman Mulyazmi Susanto", "Fajar Syarief Hidayatullah", "Faza Rahadyan Sidiq", "Hilman Ahmad Muharom", "Ilyas Hadi Kusuma", "Khoirul Azzam Ashidqi", "Luthfi Dwi Irawan", "M Dapa Ruslan", "M. Risqi Pandowo", "M.Zingga Hamzah Ulumuddin", "Mochammad Erghian Aghni Rasyidan", "Much Natsir Fairus Nurman", "Muhammad Alif Farhan", "Muhammad Daffa Almulqi Firdaus", "Muhammad Haikal Azmi", "Muhammad Najmy Tsaqib Annaisabury", "Muhammad Sayyidi Syafiq Fijratulloh", "Nabiel Ahmad Shodiq", "Nanda Juan Pratama", "Naufallatif Ahmad", "Nur Muhammad Davan Alkhaesa", "Prabu Aljabbar Putra Juhana", "Reza Ediz Arfan", "Rivan Saputra", "Satria Dwi Januar F", "Zhavier Muhammad Idrok"],
            "3H": ["A Rifky Muhaimin", "Adam Mustanir Hibatullah", "Arsyad Anwar", "Azka Fadillah Jayakusuma", "Daffa Bachdim Nadindra", "Fakhri Aryasatya Rahman", "Fawwaz Alyasir", "Ghaly Fatani Fawaz", "Hafidh Atha Musari", "Hanif Khoiri Ash Shiddiqi", "Iqbal Thoriq Al-Ghoni", "Mochamad Fachri Ediawan", "Muhamad Khoirul Akhbar", "Muhamad Raif Ramadhan", "Muhamad Zidan Awaludin", "Muhammad Danish Amsyar Piliang", "Muhammad Dyaz Wijaksana", "Muhammad Hikam Husni Mubarrok", "Muhammad Syakur Ulwan", "Muhammad Zaidan Ramadhan", "Nova Aris Mulyana", "Rainov Patrialis Sutami", "Sammi Adji Faatih Gardika", "Satria Andika Pratama", "Sayyid Munji Al-Hadi", "Utsman Andhika Mukarom", "Zamzam Arifuzaman Sa'Ad", "Zein Naajil Hurry Ramdhani"],
            "3I": ["Aidil Ahza Sakiffa", "Arif Al Hafid", "Arkan Ataya Ramadhan", "Aufa Ripqi Zaidan", "Den Rizik Asyafari", "El Fatih Nur Khoiron", "Farras Zahid Gunawan", "Fauzan Al Bairuni Surya", "Mahesya Chandra Wijaya", "Mochamad Rizki Adhitya Putra", "Muhamad Marwan Hanafi", "Muhamad Nasril Ilham", "Muhammad Azzam Ash Shiddiq", "Muhammad Dimas Syahril Nur Taqwa", "Muhammad Fauzan", "Muhammad Haikal Fathurahman", "Muhammad Naufal Musyaffa", "Muhammad Pray Raja Murtadla Rabany Alhamidi", "Muhammad Rahmat Fajar", "Naufal Raditya Putra", "Raka Aditya Rubiana", "Rifa Dio Arvia Ahmad", "Rizki Naufal Arrafi", "Sami Auliya", "Syamil Sholahuddin Hariz", "Zaidan Khairullah Firmansyah", "Zamzam Risnandi"],
            "3J": ["Abyan Zaki Al Ahnaf", "Althaf Farid Mutaqqin", "Arva Pratama Nuzulul Mauludin", "Azka Alvaro Hidayat", "Azka Deyandrika", "Dias Adytia", "Fikri Firman Firdaus", "Habib Rafi Rabbani", "Haris Febriansyah", "Ilham April Rizal", "Maulana Zidan Alfatih", "Muhammad Azka Alfarhaby Rukman", "Muhammad Herlangga Pratama", "Muhammad Hudan Al Faruq", "Muhammad Radif Al Farizi", "Muhammad Ridho Wibowo", "Muhammad Rizqi Fadilah", "Muhammad Ziqri Zayyani", "Nizam Joharudin Putra", "Panji Ikhwan Alkhoir", "Qidham Kholid Edriansyah", "Radi Aditya Labdagati", "Rafa Ramdhani Badri Aziz", "Resya Sanda Sandrian", "Reza Permana Putra", "Rizqy Pratama", "Sabiq Alif Arrasyid Hidayat", "Zian Fadhilah"]
        };

        let currentWali = "";
        let currentKelas = "";

        function handleTeacherChange(val) {
            if (!val) {
                document.getElementById('studentContainer').classList.add('hidden');
                return;
            }
            
            const parts = val.split('|');
            currentKelas = parts[0];
            currentWali = parts[1];

            document.getElementById('displayKelas').innerText = `Daftar Siswa Kelas ${currentKelas}`;
            document.getElementById('displayWali').innerText = `Wali Kelas: ${currentWali}`;
            
            renderTable(currentKelas);
            document.getElementById('studentContainer').classList.remove('hidden');
            document.getElementById('studentContainer').scrollIntoView({ behavior: 'smooth' });
        }

        function renderTable(kelas) {
            const list = studentData[kelas];
            const tbody = document.getElementById('studentTableBody');
            tbody.innerHTML = "";

            list.forEach((name, idx) => {
                const row = document.createElement('tr');
                row.className = "hover:bg-slate-50/80 transition-colors";
                row.innerHTML = `
                    <td class="p-4 text-slate-400 font-medium">${idx + 1}</td>
                    <td class="p-4 font-semibold text-slate-700">${name}</td>
                    ${createInputCell('tafsir')}
                    ${createInputCell('hadits')}
                    ${createInputCell('mahfudzat3')}
                    ${createInputCell('mahfudzat1')}
                    ${createInputCell('doa')}
                    ${createInputCell('alQuran')}
                    ${createInputCell('wudlu')}
                    ${createInputCell('tayammum')}
                    ${createInputCell('sholat')}
                `;
                tbody.appendChild(row);
            });
        }

        function createInputCell(field) {
            return `
                <td class="p-2">
                    <input type="text" data-field="${field}" 
                        class="w-full min-w-[80px] p-2 text-center text-sm border border-slate-200 rounded-lg input-focus transition-all" 
                        placeholder="-">
                </td>
            `;
        }

        async function submitData() {
            const scriptURL = 'https://script.google.com/macros/s/AKfycbxUuhY0lRulwcISa0S4mp9p_61Ts2MqRzk8eintWFJA1Pcq3pVL-H3_ohPG-XbOOOOC/exec'; 
            
            if(scriptURL === 'TEMPEL_URL_WEB_APP_ANDA_DISINI' || scriptURL === '') {
                showStatus("Error: URL Web App belum dikonfigurasi!", "error");
                return;
            }

            const rows = document.querySelectorAll('#studentTableBody tr');
            const dataToSubmit = [];

            rows.forEach(row => {
                const name = row.cells[1].innerText;
                const inputs = row.querySelectorAll('input');
                let hasValue = false;
                const rowObj = {
                    waliKelas: currentWali,
                    kelas: currentKelas,
                    namaSiswa: name
                };

                inputs.forEach(input => {
                    const field = input.getAttribute('data-field');
                    const val = input.value.trim();
                    rowObj[field] = val;
                    if (val !== "") hasValue = true;
                });

                if (hasValue) {
                    dataToSubmit.push(rowObj);
                }
            });

            if (dataToSubmit.length === 0) {
                showStatus("Mohon isi setidaknya satu nilai siswa!", "error");
                return;
            }

            const btn = document.getElementById('btnKirim');
            const spinner = document.getElementById('loadingSpinner');
            btn.disabled = true;
            spinner.classList.remove('hidden');

            try {
                // Menggunakan mode no-cors untuk menghindari blokir CORS
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(dataToSubmit)
                });

                // Karena no-cors tidak bisa membaca respon, kita anggap sukses jika sampai sini
                showStatus(`Data sedang diproses... Silakan cek Google Sheet dalam beberapa detik.`, "success");
                
                // Opsional: Kosongkan input setelah berhasil
                setTimeout(() => {
                    document.querySelectorAll('input').forEach(i => i.value = "");
                }, 1000);

            } catch (error) {
                console.error('Error!', error);
                showStatus("Gagal terhubung ke server. Pastikan URL benar dan sudah di-Deploy.", "error");
            } finally {
                btn.disabled = false;
                spinner.classList.add('hidden');
            }
        }

        function showStatus(msg, type) {
            const box = document.getElementById('statusBox');
            box.innerText = msg;
            box.classList.remove('hidden', 'bg-green-500', 'bg-red-500', 'text-white');
            
            if (type === "success") {
                box.classList.add('bg-green-500', 'text-white');
            } else {
                box.classList.add('bg-red-500', 'text-white');
            }

            setTimeout(() => {
                box.classList.add('hidden');
            }, 5000);
        }
    </script>
</body>
</html>
